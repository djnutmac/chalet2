<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eceae6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poschiavo – Partenze</title>
<style>
:root{color-scheme:only light;--bg:#eceae6;--panel:#fff;--line:#d9d6d0;--txt:#1b1b1b;--dim:#444;--red:#c6111a;box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:2vw;padding:2vh max(2vw,env(safe-area-inset-right,0px)) 2vh max(2vw,env(safe-area-inset-left,0px));box-sizing:border-box}
/* Tutto il tabellone scala in base alla sua larghezza (1 u = 1% della larghezza) e, se serve, all'altezza della finestra */
#board{container-type:inline-size;background:var(--panel);border:.6vmin solid var(--red);border-radius:1.2vmin;height:94vh;height:94dvh;box-sizing:border-box;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:0 1vmin 3vmin rgba(0,0,0,.18)}
#board>*{--u:min(1cqw,1.05vh);--cols:calc(var(--u)*11) calc(var(--u)*18) calc(var(--u)*16) 1fr calc(var(--u)*14)}
#hdr{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);padding:calc(var(--u)*.7) calc(var(--u)*2.4) calc(var(--u)*.7) calc(var(--u)*1.4);background:var(--panel)}
h1{margin:0;padding:calc(var(--u)*.8) calc(var(--u)*2.4);font-size:calc(var(--u)*3.2);font-weight:800;background:var(--red);color:#fff;text-align:left;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
h1 small{font-size:inherit;font-weight:800;transition:opacity .4s}
.row{display:grid;grid-template-columns:var(--cols);gap:calc(var(--u)*1.5);align-items:center;padding:calc(var(--u)*.45) calc(var(--u)*2.4);border-bottom:1px solid var(--line);font-size:calc(var(--u)*3);line-height:1.15}
.row>*{min-width:0}
.row.head{font-size:calc(var(--u)*2.3);font-weight:800;color:var(--txt);text-transform:uppercase;letter-spacing:.03em;border-bottom:calc(var(--u)*.5) solid var(--red);padding-top:calc(var(--u)*.8);padding-bottom:calc(var(--u)*.6)}
#hd>*{transition:opacity .4s}
#hd.fade>*,h1 small.fade{opacity:0}
.t{font-variant-numeric:tabular-nums;font-weight:800}
.d{color:var(--red);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.l{font-weight:800;color:var(--red);white-space:nowrap}
.to{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.p{text-align:right;font-weight:800}
.row.head>*{font-weight:800;font-size:inherit;letter-spacing:inherit}
@keyframes soon{0%,100%{background-color:rgba(255,204,0,0)}50%{background-color:rgba(255,204,0,.95)}}
.row.gone{display:none!important}
.row.bus{background-color:#ffcc00}
.row.bus>*{color:#000}
@keyframes soonbus{0%,100%{background-color:#ffcc00}50%{background-color:#fff}}
.row.bus.soon{animation:soonbus 1.6s ease-in-out infinite}
.row.soon{animation:soon 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.row.soon,.row.bus.soon{animation:none;background-color:#ffcc00}}
#rows.stretch{display:flex;flex-direction:column}
#rows.stretch>.row{box-sizing:border-box;flex:1 0 auto;max-height:calc(var(--u)*5.2)}
#rows{flex:1;overflow:hidden;position:relative}
#qr{width:calc(var(--u)*13);height:calc(var(--u)*13);flex:none;display:block;border-radius:calc(var(--u)*.6)}
#logo{display:block;height:calc(var(--u)*16);width:auto;flex:none}
#ct,#ph{font-weight:700;font-size:calc(var(--u)*2.6);line-height:1.5;white-space:nowrap;min-width:0}
#ws{display:flex;gap:calc(var(--u)*3);padding:calc(var(--u)*1) calc(var(--u)*2.4);border-top:calc(var(--u)*.5) solid var(--red);background:var(--panel)}
#wx{flex:1.05 1 0;min-width:0;align-self:center}
#wg{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.8) calc(var(--u)*1.4)}
#wg{grid-auto-rows:calc(var(--u)*5.6)}
.wc{display:flex;align-items:center;gap:calc(var(--u)*1);min-width:0}
.wi{width:calc(var(--u)*5);height:calc(var(--u)*5);flex:none}
.wt{min-width:0}
.wn{font-size:calc(var(--u)*1.9);font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.wd{font-size:calc(var(--u)*3);font-weight:800;line-height:1.1}
#wcr{font-size:calc(var(--u)*1.4);color:var(--dim);margin-top:calc(var(--u)*.6)}
#passi-wrap{flex:0.95 1 0;min-width:0;align-self:stretch;border-left:1px solid var(--line);padding-left:calc(var(--u)*2);display:flex;flex-direction:column;justify-content:center}
#passi-title{font-size:calc(var(--u)*1.7);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:calc(var(--u)*.6)}
#passi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:calc(var(--u)*4.2);gap:calc(var(--u)*.55) calc(var(--u)*1.2)}
.pass-card{min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.pass-name{font-size:calc(var(--u)*1.45);font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass-value{font-size:calc(var(--u)*1.8);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass-value.open{color:#16803b}.pass-value.closed{color:var(--red)}.pass-value.limited,.pass-value.notice{color:#a45f00}.pass-value.no_report,.pass-value.unknown{color:var(--dim)}
#passi-foot{display:flex;gap:calc(var(--u)*.8);align-items:center;font-size:calc(var(--u)*1.2);color:var(--dim);margin-top:calc(var(--u)*.35);white-space:nowrap;overflow:hidden}
#passi-source{color:inherit;text-decoration:underline;text-underline-offset:2px}

#clk{display:flex;justify-content:center;align-items:center;min-width:0}
svg{width:min(44vw,94vh);height:min(44vw,94vh);width:min(44vw,94dvh);height:min(44vw,94dvh);filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}
.wi>svg{display:block;width:100%;height:100%;filter:none}
@media (max-width:800px) and (orientation:portrait){body{grid-template-columns:1fr;grid-template-rows:auto auto;padding-top:calc(2vh + env(safe-area-inset-top,0px));height:auto;min-height:100%}#board{height:auto;min-height:60vh}#board>*{--u:1cqw;--cols:calc(var(--u)*12) calc(var(--u)*19) calc(var(--u)*16) 1fr calc(var(--u)*15)}svg{width:90vw;height:90vw}.row{font-size:calc(var(--u)*4.2)}.row.head{font-size:calc(var(--u)*2.7)}#ws{flex-direction:column;gap:calc(var(--u)*2)}#passi-wrap{width:100%;box-sizing:border-box;border-left:0;border-top:1px solid var(--line);padding:calc(var(--u)*1.4) 0 0;margin-top:calc(var(--u)*.6)}#passi-grid{grid-auto-rows:calc(var(--u)*5)}}
</style>
</head>

<script>
(function(){
  /* ---- Orologio ---- */
  var ci=document.getElementById('cimg'),lg=document.getElementById('logo');
  if(ci&&lg)ci.setAttribute('href',lg.getAttribute('src'));
  var t=document.getElementById('ticks'),ns='http://www.w3.org/2000/svg';
  for(var i=0;i<60;i++){
    var big=i%5===0,l=document.createElementNS(ns,'line');
    l.setAttribute('y1',-97);l.setAttribute('y2',big?-80:-91);
    l.setAttribute('stroke-width',big?4.2:1.4);
    l.setAttribute('transform','rotate('+i*6+')');
    t.appendChild(l);
  }
  var H=document.getElementById('h'),M=document.getElementById('m'),S=document.getElementById('s');
  function tick(){
    var n=new Date(),s=n.getSeconds()+n.getMilliseconds()/1000;
    var m=n.getMinutes()+s/60;
    H.setAttribute('transform','rotate('+((n.getHours()%12+m/60)*30)+')');
    M.setAttribute('transform','rotate('+m*6+')');
    S.setAttribute('transform','rotate('+s*6+')');
    requestAnimationFrame(tick);
  }
  tick();

  /* ---- Rotazione lingue ogni 5 s ---- */
  var L=[['Partenze','Ora','Ritardo','Linea','Destinazione','Binario'],
         ['Departures','Time','Delay','Line','Destination','Platform'],
         ['Abfahrt','Zeit','Verspätung','Linie','Ziel','Gleis']];
  var li=0,hd=document.getElementById('hd'),lt=document.getElementById('lt');
  setInterval(function(){
    hd.classList.add('fade');lt.classList.add('fade');document.dispatchEvent(new Event('mlout'));
    setTimeout(function(){
      li=(li+1)%L.length;var w=L[li];
      lt.textContent=w[0];
      for(var k=0;k<5;k++)hd.children[k].textContent=w[k+1];
      hd.classList.remove('fade');lt.classList.remove('fade');document.dispatchEvent(new CustomEvent('mlin',{detail:li}));
    },400);
  },5000);

  /* ---- Tabellone partenze (transport.opendata.ch, senza chiave API) ---- */
  var rows=document.getElementById('rows');
  var fmt=new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Zurich'});
  function cell(cls,txt){var e=document.createElement('span');if(cls)e.className=cls;e.textContent=txt;return e}
  function fit(){
    var all=rows.children,i,r;
    for(i=0;i<all.length;i++)all[i].style.visibility='';
    for(i=0;i<all.length;i++){r=all[i];
      if(r.offsetTop+r.offsetHeight>rows.clientHeight+1)r.style.display='none';else r.style.display='';}
  }
  function showAll(){for(var i=0;i<rows.children.length;i++)rows.children[i].style.display=''}
  function refit(){rows.classList.remove('stretch');showAll();fit();rows.classList.add('stretch')}
  window.addEventListener('resize',refit);
  if(window.ResizeObserver)new ResizeObserver(refit).observe(rows);
  function P(x){return new Date(String(x).replace(/([+-]\d{2})(\d{2})$/,'$1:$2'))}
  function blink(){
    var now=Date.now(),first=true,changed=false,i,r,t,gone;
    for(i=0;i<rows.children.length;i++){
      r=rows.children[i];t=+r.dataset.dep;
      gone=now>=t+10000;
      if(gone!==r.classList.contains('gone')){r.classList.toggle('gone',gone);changed=true}
      if(gone){r.classList.remove('soon');continue}
      if(t-now<=5*60000){
        /* ogni riga entro 5 minuti dalla partenza lampeggia; il ritardo negativo mette tutte in fase */
        if(!r.classList.contains('soon')){r.style.animationDelay='-'+(now%1600)+'ms';r.classList.add('soon')}
      }else r.classList.remove('soon');
    }
    if(changed)refit();
  }
  setInterval(blink,1000);
  /* Fonti: stazione ferroviaria + fermata bus "Poschiavo, Stazione" (bus sostitutivi dei treni) */
  var SOURCES=['Poschiavo','Poschiavo, Stazione'],cache={};
  function url(n){return 'https://transport.opendata.ch/v1/stationboard?station='+encodeURIComponent(n)+'&limit=25'}
  function depTime(x){var s=x.stop||{},pr=s.prognosis&&s.prognosis.departure;
    return P(pr||s.departure).getTime()+(pr?0:(s.delay>0?s.delay*60000:0))}
  function lineOf(x){var c=String(x.category||'').trim(),n=String(x.number||'').trim();
    if(c==='B'||/^bus$/i.test(c))return ('BUS '+(n&&n!==c?n:'')).trim();
    return (c+' '+n).trim()||x.name||''}
  function isBus(x){var c=String(x.category||'').trim();return /^(B|BN|BUS|EXB|NB|BAV|EV\d*|E\d*)$/i.test(c)||/bus|ersatz/i.test(c)}
  function city(t){return String(t||'').split(',')[0].trim()}
  function render(list){
    list=list.slice().sort(function(a,b){return depTime(a)-depTime(b)});
    var seen={};
    rows.textContent='';
    if(!list.length)return;
    list.forEach(function(x){
      var s=x.stop||{},r=document.createElement('div');r.className='row';
      var d=s.delay>0?'+'+s.delay+' min':'';
      var line=lineOf(x),to=city(x.to);
      var key=fmt.format(P(s.departure))+'|'+to+'|'+line;
      if(seen[key])return;seen[key]=1;
      if(isBus(x))r.classList.add('bus');
      r.dataset.dep=depTime(x);
      r.appendChild(cell('t',fmt.format(P(s.departure))));
      r.appendChild(cell('d',d));
      r.appendChild(cell('l',line));
      r.appendChild(cell('to',to));
      r.appendChild(cell('p',(s.platform||'').toString()));
      rows.appendChild(r);
    });
    refit();blink();
  }
  function fetchOne(n,c){
    return fetch(url(n),{signal:c.signal}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(j){cache[n]=j.stationboard||[]}).catch(function(){});
  }
  function load(){
    var c=new AbortController(),to=setTimeout(function(){c.abort()},15000);
    Promise.all(SOURCES.map(function(n){return fetchOne(n,c)})).then(function(){
      var all=[],any=false;
      SOURCES.forEach(function(n){if(cache[n]){any=true;all=all.concat(cache[n])}});
      if(any)render(all);
    }).then(function(){clearTimeout(to)});
  }
  load();
  setInterval(load,30000);

  /* ---- Tocco/clic ovunque: attiva o esce dal tutto schermo ---- */
  document.addEventListener('click',function(){
    var d=document,e=d.documentElement;
    var on=d.fullscreenElement||d.webkitFullscreenElement;
    try{
      if(on){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
      else{
        var f=e.requestFullscreen||e.webkitRequestFullscreen;
        if(f){var p=f.call(e);if(p&&p.catch)p.catch(function(){})}
      }
    }catch(x){}
  });
})();
</script>

<script>
/* Meteo (Open-Meteo) */
(function(){
  var CITIES=[['Poschiavo',46.326,10.058],['Tirano',46.215,10.170],['Passo Bernina',46.409,10.022],['Sankt Moritz',46.490,9.835]];
  var wxAt=0,wcs=[];
  var wg=document.getElementById('wg');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

  /* icone meteo: SVG disegnate qui, nessuna libreria */
  function cloud(col,dy){return '<g fill="'+col+'" transform="translate(0 '+(dy||0)+')"><circle cx="16" cy="25" r="8"/><circle cx="26" cy="19" r="10"/><circle cx="36" cy="26" r="8"/><rect x="16" y="26" width="20" height="8"/></g>'}
  function sun(cx,cy,r,ray){var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#f5b301"/>',i,a;
    for(i=0;i<8;i++){a=i*Math.PI/4;
      s+='<line x1="'+(cx+(r+3)*Math.cos(a)).toFixed(1)+'" y1="'+(cy+(r+3)*Math.sin(a)).toFixed(1)+'" x2="'+(cx+(r+3+ray)*Math.cos(a)).toFixed(1)+'" y2="'+(cy+(r+3+ray)*Math.sin(a)).toFixed(1)+'" stroke="#f5b301" stroke-width="2.6" stroke-linecap="round"/>'}
    return s}
  function moon(id,cx,cy,r){return '<defs><mask id="'+id+'"><rect width="48" height="48" fill="#fff"/><circle cx="'+(cx+r*.55)+'" cy="'+(cy-r*.45)+'" r="'+(r*.8)+'" fill="#000"/></mask></defs><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#9fb0c6" mask="url(#'+id+')"/>'}
  function icon(code,day,n){
    var g;
    if(code===0||code===1)g=day?sun(24,24,9,5):moon('mk'+n,22,26,14);
    else if(code===2)g=(day?sun(17,17,6,4):moon('mk'+n,16,17,8))+'<g transform="translate(7 9) scale(.85)">'+cloud('#8a97a6')+'</g>';
    else if(code===45||code===48)g=cloud('#aab4c0',-3)+'<g stroke="#9aa7b8" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="36" x2="36" y2="36"/><line x1="16" y1="40" x2="40" y2="40"/><line x1="12" y1="44" x2="36" y2="44"/></g>';
    else if((code>=51&&code<=67)||(code>=80&&code<=82))g=cloud('#7d8a99',-4)+'<g stroke="#2f7fd6" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="34" x2="15" y2="42"/><line x1="26" y1="34" x2="23" y2="42"/><line x1="34" y1="34" x2="31" y2="42"/></g>';
    else if((code>=71&&code<=77)||code===85||code===86)g=cloud('#8a97a6',-4)+'<g fill="#fff" stroke="#4da3f0" stroke-width="1.6"><circle cx="17" cy="38" r="2.6"/><circle cx="26" cy="42" r="2.6"/><circle cx="35" cy="38" r="2.6"/></g>';
    else if(code>=95)g=cloud('#5f6b7a',-5)+'<polygon points="28,28 20,39 25,39 22,47 32,34 27,34 31,28" fill="#f5b301"/>';
    else g=cloud('#8a97a6');
    return '<svg viewBox="0 0 48 48" aria-hidden="true">'+g+'</svg>'}

  /* costruzione delle caselle */
  CITIES.forEach(function(c,i){var cell=el('div','wc'),ic=el('div','wi'),t=el('div','wt'),d=el('div','wd','\u2014');
    ic.innerHTML=icon(3,true,i);t.appendChild(el('div','wn',c[0]));t.appendChild(d);cell.appendChild(ic);cell.appendChild(t);wg.appendChild(cell);wcs.push({ic:ic,d:d})});


  /* meteo: Open-Meteo, ogni 15 minuti */
  var WURL='https://api.open-meteo.com/v1/forecast?latitude='+CITIES.map(function(c){return c[1]}).join(',')+'&longitude='+CITIES.map(function(c){return c[2]}).join(',')+'&current=temperature_2m,weather_code,is_day&timezone=Europe%2FRome';
  function loadWx(){
    fetch(WURL,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
      var a=Array.isArray(j)?j:[j];
      CITIES.forEach(function(c,i){var w=a[i]&&a[i].current;if(!w||w.temperature_2m==null)return;
        wcs[i].d.textContent=Math.round(w.temperature_2m)+'\u00b0';
        wcs[i].ic.innerHTML=icon(w.weather_code,w.is_day!==0,i)});
      wxAt=Date.now();
    }).catch(function(){});
  }
  /* se il meteo non si aggiorna da 3 ore, meglio non mostrare valori vecchi */
  setInterval(function(){if(wxAt&&Date.now()-wxAt>3*3600000){wcs.forEach(function(w){w.d.textContent='\u2014'});wxAt=0}},60000);

  loadWx();
  setInterval(loadWx,15*60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)loadWx()});
})();
</script>
<script>
/* Aggiornamento automatico: ogni 30 minuti (e quando il tablet si risveglia) controlla se index.html online e' cambiato; se si', ricarica la pagina. */
(function(){
  var base=null;
  function hash(t){var x=0,i;for(i=0;i<t.length;i++){x=(x*31+t.charCodeAt(i))|0}return x}
  function check(){
    fetch('index.html?v='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.ok?r.text():null})
      .then(function(t){
        if(!t)return;
        var k=hash(t);
        if(base===null){base=k;return}
        if(k!==base)location.reload();
      }).catch(function(){});
  }
  check();
  setInterval(check,30*60*1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
})();
</script>
