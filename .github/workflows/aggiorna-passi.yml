name: Aggiorna stato passi

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-stato-passi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Aggiorna dati da strassen.gr.ch
        run: python scripts/update_pass_status.py

      - name: Pubblica il file dati nel repository
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/passi.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento da pubblicare"
          else
            git commit -m "Aggiorna stato dei passi"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
